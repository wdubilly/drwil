<script>
const $ = (s) => document.querySelector(s);
const LANG = document.documentElement.lang === "fr" ? "fr" : "en";
const LOCALE = LANG === "fr" ? "fr-FR" : "en-GB";
const TX = JSON.parse($("#i18n").textContent)[LANG];
const t = (key, ...v) => (TX[key] ?? key).replace(/\{(\d)\}/g, (_, i) => v[i] ?? "");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const code = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
// Le navigateur peut refuser le stockage (navigation privée) : un réglage perdu, jamais une page cassée.
const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const stem = (p) => String(p ?? "").split("/").pop().replace(/\.md$/, "");
const dateTime = (d) => new Date(d).toLocaleString(LOCALE, { dateStyle: "short", timeStyle: "short" });
const plabel = (forge) => (forge === "gitlab" ? "MR" : "PR");
// Jamais d'adresse de forge dans la page : le lien passe par la redirection du serveur (QUA-271).
const plink = (n) => `<a href="/forge/pr/${Number(n)}" target="_blank" rel="noreferrer">#${Number(n)}</a>`;
const missing = (v) => (v && v.missing ? `<div class="card warn">${esc(v.missing)}</div>` : "");
const none = (text) => `<div class="card mute">${esc(text)}</div>`;

function dur(a, b) {
  if (!a) return "";
  const s = Math.max(0, Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 1000));
  const txt = s >= 60 ? `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s` : `${s} s`;
  return b ? txt : `${t("running")} · ${txt}`;
}
function cls(x) {
  if (x.status !== "completed") return x.status === "in_progress" ? "run" : "skip";
  return x.conclusion === "success" ? "ok" : x.conclusion === "skipped" ? "skip" : "ko";
}
const ICON = { ok: "✓", ko: "✗", run: "●", skip: "–" };
const tok = (n) => (n >= 1e6 ? `${(n / 1e6).toLocaleString(LOCALE, { maximumFractionDigits: 1 })} M` : n >= 1e3 ? `${Math.round(n / 1e3)} k` : String(n));
const hm = (m) => (m >= 60 ? `${Math.floor(m / 60)} h ${String(Math.round(m % 60)).padStart(2, "0")}` : `${Math.round(m)} min`);

// Un ID de contrat n'est jamais montré seul : suivi de son titre abrégé.
let titles = {};
const ids = (html) =>

function stable(el, html) {
  if (el._html === html) return;
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed && el.contains(sel.anchorNode)) return;
  let anchor = null;
  if (el.offsetParent !== null) {
    for (const n of el.querySelectorAll("[data-key],[data-id],h2")) {
      const top = n.getBoundingClientRect().top;
      if (top >= 0) { anchor = { key: n.dataset.key || n.dataset.id || `h2:${n.textContent}`, top }; break; }

  el.replaceChildren(...new DOMParser().parseFromString(html, "text/html").body.childNodes);
  for (const d of el.querySelectorAll("details[data-id]")) if (userOpen.has(d.dataset.id)) d.open = userOpen.get(d.dataset.id);
  if (anchor) {

function md(text) {
  const out = [];
  let inCode = false, inComment = false, para = [];
  const inline = (s) => ids(esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"));
  const flush = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  for (const line of String(text).split("\n")) {
    if (inCode) { if (/^\s*```/.test(line)) { out.push("</pre>"); inCode = false; } else out.push(`${esc(line)}\n`); continue; }
    if (inComment) { if (line.includes("-->")) { out.push("</pre></details>"); inComment = false; } else out.push(`${esc(line)}\n`); continue; }
    if (/^\s*```/.test(line)) { flush(); out.push("<pre>"); inCode = true; continue; }
    const c = /^<!--\s*(\w*)/.exec(line);
    if (c && !line.includes("-->")) { flush(); out.push(`<details><summary class="mute">${esc(t("block", c[1] || t("comment")))}</summary><pre>`); inComment = true; continue; }
    const h = /^(#{1,4})\s+(.*)$/.exec(line);
    if (h) { flush(); const n = Math.min(h[1].length + 2, 6); out.push(`<h${n} class="mdh">${inline(h[2])}</h${n}>`); continue; }
    const li = /^(\s*)(?:[-*]|\d+\.)\s+(.*)$/.exec(line);
    if (li) { flush(); out.push(`<div class="li" style="margin-left:${Math.min(li[1].length * 6 + 2, 32)}px">• ${inline(li[2])}</div>`); continue; }
    if (/^\s+\S/.test(line) && out.length && out[out.length - 1].startsWith('<div class="li"')) {
      out[out.length - 1] = out[out.length - 1].replace(/<\/div>$/, ` ${inline(line.trim())}</div>`);
      continue;
    }
    if (!line.trim()) { flush(); continue; }
    para.push(line.trim());
  }
  flush();
  if (inCode || inComment) out.push("</pre>");
  return out.join("");
}

  for (const w of use.workstreams) {
    const key = w.version ?? unreleased;
    const v = versions.get(key) ?? { tokens: 0, count: 0, minutes: 0 };
    v.tokens += w.tokens; v.count += 1; v.minutes += w.duration_min;
    versions.set(key, v);
  }
  const max = Math.max(1, ...use.workstreams.map((w) => w.tokens));
  const vmax = Math.max(1, ...[...versions.values()].map((v) => v.tokens));
  const total = use.workstreams.reduce((a, w) => a + w.tokens, 0);
  stable($("#us"), `${missing(use)}${use.workstreams.length ? `<div class="card"><b>${esc(t("usageTotal", tok(total), use.workstreams.length))}</b></div>
    <h2>${esc(t("byVersion"))}</h2><div class="card">${[...versions.entries()].map(([name, v]) => `<div><div class="row"><b>${esc(name)}</b><span class="d">${tok(v.tokens)}</span></div>${bar(v.tokens, vmax)}<div class="mute">${esc(t("wsCount", v.count, hm(v.minutes)))}</div></div>`).join("")}</div>
    <h2>${esc(t("byWs"))}</h2>${use.workstreams.map((w) => {
      const open = wsOpen.has(w.workstream);
      return `<div class="card can" data-key="${esc(w.workstream)}"><div class="row" style="border:0"><b>${esc(w.workstream)} <span class="mute">${open ? "▾" : "▸"}</span></b><span class="d"><b>${tok(w.tokens)}</b></span></div>${bar(w.tokens, max)}
        <div class="stats"><span class="mute">${esc(w.date)}</span><span class="mute">${esc(w.version ?? unreleased)}</span><span>${hm(w.duration_min)}</span><span>${w.requests} ${esc(t("requests"))}</span><span>${tok(w.output)} ${esc(t("output"))}</span><span>${tok(w.cache_read)} ${esc(t("cacheRead"))}</span>${w.models?.length ? `<span class="mute">${esc(t("models", w.models.join(", ")))}</span>` : ""}</div>
        ${open ? `<div class="doc">${wsDetail(wsCache[w.workstream])}</div>` : ""}</div>`;
    }).join("")}` : ""}`);
};
clickable(".card[data-key]", $("#us"), (c) => {
  const w = c.dataset.key;
  if (flip(wsOpen, w)) loadInto(wsCache, w, `/api/workstream?name=${encodeURIComponent(w)}`, RENDER.us);
  RENDER.us();
});

let kbVersion = store.get("kb-version", "");
const kbOpen = new Set();
const STAGES = ["fusionnee", "pr", "chantier", "fiche", "intention", "autre"];
const COLS = ["notes", "intentions", "fiches", "chantier", "prs", "fusionnees", "publiees"];
const COL_OPEN = new Set(["chantier", "prs"]);
const wide = () => window.matchMedia("(min-width:900px)").matches;
function cardHtml(c) {
  const open = kbOpen.has(c.id);
  const isDoc = String(c.id).endsWith(".md");
  const prKey = /^pr-\d+$/.test(c.id) ? `${c.id}-card` : "";
  const meta = [
    c.version ? `<span class="chip">${esc(c.version)}${c.order ? ` · ${Number(c.order)}` : ""}</span>` : "",
    (c.marks || []).map((m) => `<span class="tag ${esc(m)}">${esc(m)}</span>`).join(""),
    c.nature ? `<span class="tag ${esc(c.nature)}">${esc(c.nature)}</span>` : "",
    c.number ? plink(c.number) : "",
    c.activity ? `<span class="pill">${esc(c.activity)}</span>` : "",
    c.date ? `<span class="mute">${esc(c.date)}</span>` : "",
    c.maturity ? `<span class="tag">${esc(t(`mat-${c.maturity}`))}</span>` : "",
    c.ready !== undefined ? `<span class="tag ${c.ready ? "ready" : ""}">${esc(t(c.ready ? "ready" : "notReady"))}</span>` : "",
  ].filter(Boolean).join(" ");
  const extra = [
    c.lot ? t("lot", c.lot.current) : "",
    c.reopened ? t("reopened", c.reopened) : "",
    c.autoMerge ? t("autoMerge") : "",
    c.decisions ? t("toDecide", c.decisions) : "",
    c.questions ? t("toAnswer", c.questions) : "",
    c.files ? t("files", c.files) : "",
    c.code !== undefined ? t("codeDoc", c.code, c.doc) : "",
  ].filter(Boolean).map(esc).join(" · ");
  const body = !open ? "" : isDoc ? docHtml(c.id) : prKey ? `<div class="doc">${detailHtml(prKey)}</div>` : "";
  return `<div class="kc ${kbVersion && c.version === kbVersion ? "hl" : ""}" data-key="${esc(c.id)}" data-doc="${isDoc ? "1" : ""}" data-pr="${esc(prKey)}" data-tag="${c.code !== undefined ? esc(c.id) : ""}">
    <div>${rich(String(c.title).length > 160 && !open ? `${String(c.title).slice(0, 160)}…` : c.title)}</div>
    <div>${meta}</div>${extra ? `<div class="mute">${extra}</div>` : ""}${body}</div>`;
}
RENDER.kb = () => {
  const kb = data.board;
  if (!kb) return;
  const L = plabel(kb.forge);
  const band = kb.targets.map((x) => {
    const counts = {};
    x.items.forEach((i) => { counts[i.stage] = (counts[i.stage] || 0) + 1; });
    const present = STAGES.filter((k) => counts[k]);
    return `<div class="card"><h3>${esc(t("versionTitle", x.version))} <span class="mute">· ${esc(t("versionDone", x.done, x.total))}${kb.lastRelease ? esc(t("since", kb.lastRelease)) : ""}</span></h3>
      <div class="prog">${present.map((k) => `<div class="s-${k}" style="width:${(100 * counts[k]) / x.total}%"></div>`).join("")}</div>
      <div class="mute">${present.map((k) => `<span class="dot s-${k}"></span>${counts[k]} ${esc(t(`stage-${k}`))}`).join(" &nbsp; ")}</div>
      <details data-id="${esc(`band|${x.version}`)}"><summary class="mute">${esc(t("detail"))}</summary>${x.items.map((i) => `<div class="li"><span class="dot s-${esc(i.stage)}"></span>${i.order ? `${Number(i.order)}. ` : ""}${rich(i.title)} <span class="mute">— ${esc(t(`stage-${i.stage}`))}${i.number ? ` ${plink(i.number)}` : ""}</span></div>`).join("")}</details></div>`;
  }).join("");
  const versions = kb.targets.map((x) => x.version);
  if (kbVersion && !versions.includes(kbVersion)) kbVersion = "";
  const only = store.get("kb-only", "0") === "1" && kbVersion;
  const select = versions.length ? `<select id="kbv"><option value="">${esc(t("versionAll"))}</option>${versions.map((v) => `<option ${v === kbVersion ? "selected" : ""} value="${esc(v)}">${esc(t("versionTitle", v))}</option>`).join("")}</select>
    <label class="kinds"><input type="checkbox" id="kbonly" ${only ? "checked" : ""}> ${esc(t("versionOnly"))}</label>` : "";
  const cols = COLS.map((k) => {
    const list = (kb.cols[k] || []).filter((c) => !only || c.version === kbVersion || k === "publiees");
    return `<details class="col" data-id="${esc(`col|${k}`)}" ${wide() || (COL_OPEN.has(k) && list.length) ? "open" : ""}><summary>${esc(t(`col-${k}`, L))} · ${list.length}</summary>${list.map(cardHtml).join("") || '<div class="mute">—</div>'}</details>`;
  }).join("");
  stable($("#kb"), `${missing(kb)}<div class="band">${band}</div>${select}<div class="board">${cols}</div><div class="mute" style="margin-top:8px">${esc(t("boardNote"))}</div>`);
};
$("#kb").addEventListener("change", (ev) => {
  if (ev.target.id === "kbv") { kbVersion = ev.target.value; store.set("kb-version", kbVersion); }
  if (ev.target.id === "kbonly") store.set("kb-only", ev.target.checked ? "1" : "0");
  RENDER.kb();
});
clickable(".kc", $("#kb"), (k) => {
  if (k.dataset.tag) { relOpen.add(k.dataset.tag); show("rel"); return; }
  const id = k.dataset.key;
  if (flip(kbOpen, id)) {
    if (k.dataset.doc) loadFile(id, RENDER.kb);
    else if (k.dataset.pr) openDetail(k.dataset.pr, RENDER.kb);
  }
  RENDER.kb();
}, "a, .doc, input, select, label");

const relOpen = new Set(["Unreleased"]);
RENDER.rel = () => {
  const rel = data.releases;
  if (!rel) return;
  const L = plabel(rel.forge);
  stable($("#rel"), missing(rel) + rel.releases.map((r) => {
    const open = relOpen.has(r.tag);
    const nCode = r.prs.filter((p) => p.nature === "code").length;
    return `<div class="card can" data-key="${esc(r.tag)}"><h3>${esc(r.tag === "Unreleased" ? t("unreleased") : r.tag)} ${r.latest ? `<span class="tag ready">${esc(t("latest"))}</span>` : ""}${r.prerelease ? `<span class="tag">${esc(t("pre"))}</span>` : ""}${r.tag !== "Unreleased" && !r.published ? `<span class="tag P2">${esc(t("tagOnly"))}</span>` : ""} <span class="mute">${open ? "▾" : "▸"}</span></h3>
      <div class="mute">${esc(r.date ?? t("nextVersion"))} · ${esc(t("relMeta", L, nCode, r.prs.length - nCode, r.workstreams.length, tok(r.tokens)))}</div>
      ${open ? `<div class="doc">
        ${r.workstreams.length ? `<h4 class="mdh">${esc(t("relWs"))}</h4>${r.workstreams.map((w) => `<div class="li">• ${esc(w.name)} <span class="mute">${tok(w.tokens)}</span></div>`).join("")}` : ""}
        ${r.prs.length ? `<h4 class="mdh">${esc(t("relPrs", L))}</h4>${r.prs.map((p) => `<div class="li">• <span class="tag ${esc(p.nature)}">${esc(p.nature)}</span>${plink(p.number)} ${rich(p.title)} <span class="mute">${esc(p.date)}</span></div>`).join("")}` : ""}
        ${r.changelog ? `<h4 class="mdh">${esc(t("relChangelog"))}</h4>${md(r.changelog)}` : `<div class="mute">${esc(t("relNoChangelog"))}</div>`}
      </div>` : ""}</div>`;
  }).join(""));
};
clickable(".card[data-key]", $("#rel"), (c) => { flip(relOpen, c.dataset.key); RENDER.rel(); });

const secs = (v) => (v >= 60 ? `${Math.floor(v / 60)} min ${String(v % 60).padStart(2, "0")} s` : `${v} s`);
function trendCard(label, tr, fmt) {
  if (!tr) return `<div class="card"><h3>${esc(label)}</h3><div class="mute">${esc(t("trendNone"))}</div></div>`;
  const max = Math.max(tr.threshold, ...tr.history.map((p) => p.value));
  const recent = tr.history.length - tr.points.length;
  const verdict = t(tr.alert ? "trendAlert" : "trendOk", fmt(tr.mean), fmt(tr.threshold));
  return `<div class="card ${tr.alert ? "warn" : ""}"><h3>${esc(label)}</h3>
    <div class="${tr.alert ? "ko" : "mute"}">${tr.alert ? "⚠ " : ""}${esc(verdict)}</div>
    ${tr.history.map((p, i) => `<div class="row" style="border:0"><span class="mute">${esc(p.label)}</span><span class="d">${esc(fmt(p.value))}</span></div>${bar(p.value, max, `${p.value > tr.threshold ? "over" : ""} ${i < recent ? "old" : ""}`)}`).join("")}</div>`;
}
RENDER.me = () => {
  const m = data.measures;
  if (!m) return;
  const runs = (data.ci?.targets ?? []).flatMap((x) => x.workflows.filter((w) => w.status === "completed").map((w) => ({ branch: x.branch, ...w })));
  const last = runs.length ? `<h2>${esc(t("lastRuns"))}</h2>${runs.map((w) => `<div class="card"><h3><span class="${cls(w)}">${ICON[cls(w)]}</span> ${esc(w.name)} <span class="mute">${esc(w.branch)}</span></h3>${w.jobs.map((j) => `<div class="row"><span>${esc(j.name)}</span><span class="d">${dur(j.started, j.completed)}</span></div>`).join("")}</div>`).join("")}` : "";
  stable($("#me"), `${missing(m)}<div class="band">${trendCard(t("trendCi"), m.ci, secs)}${trendCard(t("trendCache"), m.cache, tok)}</div><div class="mute">${esc(t("trendNote"))}</div>${last}`);
};

RENDER.au = () => {
  const view = data.audits;
  if (!view) return;
  stable($("#au"), missing(view) + view.audits.map((a) => `<div class="card ${a.staleDays !== null ? "warn" : ""}"><h3>${code(a.title || a.path)}</h3><div class="mute"><code>${esc(a.path)}</code></div>
    ${a.staleDays !== null ? `<div class="run">⚠ ${esc(t("auditStale", a.staleDays))}</div>` : ""}
    <dl>${a.entries.map((e) => `<dt>${esc(e.key)}</dt><dd>${rich(e.value)}</dd>`).join("")}</dl></div>`).join(""));
};

const stateDocs = () => { renderHeader(); RENDER.briefs(); RENDER.notes(); RENDER.int(); };
function show(name) {
  tab = name;
  store.set("tab", name);
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === name));
  document.querySelectorAll("main section").forEach((s) => s.classList.toggle("on", s.id === name));
  RENDER[name]?.();
  document.querySelector("#tabs button.on")?.scrollIntoView({ inline: "center", block: "nearest" });
  tick();
}
$("#tabs").innerHTML = TABS.map((k) => `<button data-t="${k}">${esc(t(`tab-${k}`))}</button>`).join("");
$("#tabs").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) show(b.dataset.t); });
$("#q").placeholder = t("qSearch");

// Un onglet ouvert pendant une lecture relance un tour à sa fin : sinon il resterait vide jusqu'au tour suivant.
let busy = false, again = false;
async function tick() {
  if (busy) { again = true; return; }
  busy = true;
  again = false;
  denied = false;
  let failed = false;
  const load = async (name) => {
    try { data[name] = await getJson(`/api/${name}`); } catch { failed = true; }
  };
  await load("docs");
  if (data.docs) stateDocs();
  if (!data.contracts) await load("contracts");
  if (data.contracts?.contracts) titles = Object.fromEntries(data.contracts.contracts.map((c) => [c.id, c.title]));
  await Promise.all(FEEDS[tab].map(load));
  RENDER[tab]?.();
  $("#upd").textContent = denied ? t("denied") : failed ? t("offline") : t("updated", new Date().toLocaleTimeString(LOCALE));
  busy = false;
  if (again) tick();
}
show(tab);
setInterval(() => { if (!document.hidden) tick(); }, 10000);
// Les durées d'une CI en cours avancent entre deux lectures.
setInterval(() => { if (!document.hidden && tab === "ci") RENDER.ci(); }, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
</script>
</body>
</html>
