# QUA-263: one pipeline per push, the branch pipeline, which the merge request shows as its own: no merge request pipeline replays the same
# commit a second time (`workflow: rules` refuses them). GitLab sets CI, so run-checks also plays the checks left to CI (`runAt: ["ci"]`, QUA-208), proven by that pipeline only (QUA-262).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

stages:
  - plan
  - slices
  - test
  # drwil-project-begin stages
  # Stages of the project, after the kit's checks: kept as they are by `drwil init`, which moves here any stage that is not the kit's.
  # drwil-project-end stages
  - alert

# Sharded checks (`shards: N` in .drwil/ia-first.json, never in this file). The plan stage reads N from the configuration; `parallel:` is
# static in GitLab, so the slices job always starts the maximum (16, the ceiling of `shards`) and a slice above N plays nothing and leaves
# no verdict: it is "not applicable", never counted as passed (QUA-013). A stage that fails stops the next ones, so `checks` never
# succeeds by default when the plan or a slice failed; no sharded check: count 0, every slice is not applicable.
plan:
  stage: plan
  image: node:24
  variables:
    GIT_DEPTH: "0"
  script:
    - mkdir -p .drwil/evidence
    # QUA-250: the previous pipeline of this branch settled some sharded checks (its slow verdicts, replayed at the least doubt): no slice is planned for them.
    - node .githooks/run-checks.mjs --pr-previous
    # A declaration the engine refuses fails this job: that is no plan, never "no slice".
    - node .githooks/run-checks.mjs --shard-plan > .drwil/evidence/shard-plan.json
    # QUA-296: a main-branch tree that the merged branch's last green pipeline proved (laid last by its `checks`) plans no slice, and the plan
    # carries the proof and its verdicts to `checks`. The job token cannot read merge requests: the branch points at this commit or its second parent, or the default merge message names it.
    - |
      if [ -z "$CI_COMMIT_TAG" ] && [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        tree=$(git rev-parse 'HEAD^{tree}'); heads=" $CI_COMMIT_SHA $(git rev-parse -q --verify 'HEAD^2' || true) "; p=$(mktemp -d)
        branches=$( { git ls-remote --heads origin | while read -r sha ref; do case "$heads" in *" $sha "*) echo "${ref#refs/heads/}";; esac; done; git log -1 --format=%s | sed -n "s/^Merge branch '\(.*\)' into .*/\1/p"; } | grep -vx "$CI_DEFAULT_BRANCH" | sort -u || true)
        for branch in $branches; do
          url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$(printf %s "$branch" | sed 's|/|%2F|g')/raw/.drwil/evidence/pr-verdicts"
          curl -sSfL --header "JOB-TOKEN: $CI_JOB_TOKEN" -o "$p/tree" "$url/proven-tree.txt?job=checks" 2>/dev/null && [ "$(cat "$p/tree")" = "$tree" ] || continue
          echo "Checks not replayed: tree $tree is the one the green pipeline of $branch proved."
          curl -sSfL --header "JOB-TOKEN: $CI_JOB_TOKEN" -o "$p/verdicts" "$url/run-checks-verdicts.json?job=checks" 2>/dev/null || true
          node -e 'const fs = require("fs"); const [, file, tree, branch] = process.argv; let v = null; try { v = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
            if (!v?.checks || typeof v.checks !== "object" || Array.isArray(v.checks)) { v = null; console.log(`WARNING: no readable verdict in the proof of ${branch}: the verdicts are not saved.`); }
            fs.writeFileSync(".drwil/evidence/shard-plan.json", JSON.stringify({ include: [], proven: { tree, branch, verdicts: v } }));' "$p/verdicts" "$tree" "$branch"
          break
        done
        grep -q '"proven"' .drwil/evidence/shard-plan.json || echo "Tree not proven by a green pipeline of the merged branch: everything is replayed."
      fi
    - cat .drwil/evidence/shard-plan.json
  artifacts:
    paths:
      - .drwil/evidence/shard-plan.json
    expire_in: 1 day

# One job per slice. Off the main branch, it plays with the main branch's hooks (QUA-113); its verdict is an artifact of this pipeline
# that `checks` downloads (same pipeline, never a cache), even after a failure: a failed slice leaves "fail", one that left none is missing.
shards:
  stage: slices
  image: node:24
  parallel: 16
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      count=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).include.length)' .drwil/evidence/shard-plan.json)
      if [ "$CI_NODE_INDEX" -gt "$count" ]; then
        echo "Slice $CI_NODE_INDEX not applicable: $count slice(s) declared."
        exit 0
      fi
      slice="$CI_NODE_INDEX/$count"
      target="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      if [ -z "$CI_COMMIT_TAG" ] && [ "$CI_COMMIT_BRANCH" != "$target" ]; then
        git fetch --quiet origin "+refs/heads/$target:refs/remotes/origin/$target"
        base="origin/$target"
        if git cat-file -e "$base:.githooks/base-checks.mjs" 2>/dev/null; then
          git show "$base:.githooks/base-checks.mjs" > /tmp/base-checks.mjs
        else
          cp .githooks/base-checks.mjs /tmp/base-checks.mjs
        fi
        node /tmp/base-checks.mjs --base "$base" --shard "$slice"
      else
        node .githooks/run-checks.mjs --shard "$slice"
      fi
  artifacts:
    when: always
    paths:
      - .drwil/evidence/shards
    expire_in: 1 day

checks:
  stage: test
  image: node:24
  # Full history: the replay below reads the main branch's hooks and the branch's commits.
  variables:
    GIT_DEPTH: "0"
  # Only the gitleaks archive, never the verdicts (see below): a poisoned cache fails the sum check.
  cache:
    key: gitleaks-8.21.2-linux-x64
    paths:
      - .drwil/evidence/gitleaks.tar.gz
  script:
    # Without gitleaks the secrets check is "not run", which fails run-checks in CI (QUA-013).
    # Pinned version, archive checked against its published sum; installed where the engine looks (~/.local/bin).
    # The download retries a transient error (a 504 included); the archive is cached under its pinned version and checked on every pass.
    - mkdir -p .drwil/evidence ~/.local/bin
    - '[ -s .drwil/evidence/gitleaks.tar.gz ] || curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 -o .drwil/evidence/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz'
    - echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  .drwil/evidence/gitleaks.tar.gz" | sha256sum -c -
    - tar -xzf .drwil/evidence/gitleaks.tar.gz -C ~/.local/bin gitleaks
    # QUA-250: the last successful pipeline of this branch (the identity of its merge request) leaves its slow verdicts (artifact `pr-verdicts`).
    - node .githooks/run-checks.mjs --pr-previous
    # QUA-250: off the main branch, the verdicts of the main branch's last successful pipeline are
    # downloaded (its artifact, which only a main-branch pipeline keeps, see after_script) and
    # run-checks reuses each "ok" check whose fingerprint (files and command) is unchanged. The sharded checks are judged on the
    # verdicts of the slices of this pipeline (`--aggregate-shards`, downloaded from the slices stage). Not the
    # GitLab cache: protected and unprotected branches do not share it by default, and a shared one
    # could be written by a merge request. No verdict downloaded: everything is replayed.
    # QUA-296: on the main branch, the plan's proof of this very tree skips the checks, its verdicts kept; QUA-297: restored verdicts dated.
    - |
      verdicts=.drwil/evidence/run-checks-verdicts.json
      if [ -z "$CI_COMMIT_TAG" ] && [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && node -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync(".drwil/evidence/shard-plan.json", "utf8")).proven;
        if (!p || p.tree !== process.argv[1]) process.exit(1); if (p.verdicts) fs.writeFileSync(process.argv[2], JSON.stringify(p.verdicts));' "$(git rev-parse 'HEAD^{tree}')" "$verdicts" 2>/dev/null; then
        echo "Checks not replayed: this tree is proven (see the plan job)."
      elif [ -z "$CI_COMMIT_TAG" ] && [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        mkdir -p .drwil/evidence
        curl -sSfL --header "JOB-TOKEN: $CI_JOB_TOKEN" -o "$verdicts" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_DEFAULT_BRANCH/raw/$verdicts?job=checks" \
          || { rm -f "$verdicts"; echo "No verdict of the main branch's CI: every check is replayed."; }
        [ ! -s "$verdicts" ] || echo "Verdicts cache: the main branch's last successful pipeline, run at $(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).ranAt' "$verdicts" 2>/dev/null || echo "an unknown date")."
        DRWIL_CI_REUSE=1 node .githooks/run-checks.mjs --aggregate-shards .drwil/evidence/shards
      else
        node .githooks/run-checks.mjs --aggregate-shards .drwil/evidence/shards
      fi
    # QUA-296: off the main branch, this pass's verdicts are kept for the merge before the replay below rewrites them.
    - '[ -n "$CI_COMMIT_TAG" ] || [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || { mkdir -p .drwil/evidence/pr-verdicts && cp .drwil/evidence/run-checks-verdicts.json .drwil/evidence/pr-verdicts/ 2>/dev/null || true; }'
    # QUA-113: off the main branch, the checks are replayed with the main branch's hooks (its .githooks/, read through Git) and the
    # branch's list of checks: a merge request that weakens a hook or removes a check does not validate itself. The main branch's copy
    # of base-checks.mjs runs; the branch's only while the main branch has none yet (kit adoption).
    - |
      target="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      if [ -z "$CI_COMMIT_TAG" ] && [ "$CI_COMMIT_BRANCH" != "$target" ]; then
        git fetch --quiet origin "+refs/heads/$target:refs/remotes/origin/$target"
        base="origin/$target"
        if git cat-file -e "$base:.githooks/base-checks.mjs" 2>/dev/null; then
          git show "$base:.githooks/base-checks.mjs" > /tmp/base-checks.mjs
          node /tmp/base-checks.mjs --base "$base" --aggregate-shards .drwil/evidence/shards
        else
          node .githooks/base-checks.mjs --base "$base" --aggregate-shards .drwil/evidence/shards
        fi
      fi
    # QUA-296: last line of the kit, so laid only when every line above succeeded: the tree this pipeline proved.
    - '[ -n "$CI_COMMIT_TAG" ] || [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || git rev-parse "HEAD^{tree}" > .drwil/evidence/pr-verdicts/proven-tree.txt'
    # drwil-project-begin steps
    # Script lines of the project: kept as they are by `drwil init`, which rewrites everything outside the project zones.
    # drwil-project-end steps
  # QUA-250: only a main-branch pipeline, which never asks for reuse and so replays everything,
  # keeps its verdicts (even when a check failed: an "ok" stays true); elsewhere the file is
  # removed before the upload, so a merge request never writes a verdict it could read.
  after_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ] || [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        rm -f .drwil/evidence/run-checks-verdicts.json
      else
        rm -rf .drwil/evidence/pr-verdicts
      fi
  artifacts:
    when: always
    paths:
      - .drwil/evidence/run-checks-verdicts.json
      - .drwil/evidence/pr-verdicts

# drwil-project-begin jobs
# Jobs of the project: kept as they are by `drwil init`, which rewrites everything outside the project zones.
# drwil-project-end jobs

# No branch protection is possible on an equivalent GitLab plan (merging stays an unconditional click): only an after-the-fact alert.
# `when: on_failure` + a dedicated stage: triggers only if a job of the `test` stage failed, and only on the main branch. Best-effort:
# depending on the GitLab project's configuration, the job token may not be allowed to write issues — this job then fails without
# blocking `checks`. Opens no duplicate if an equivalent issue is already open.
alert-if-ci-broken:
  stage: alert
  image: alpine:3
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_failure
  script:
    - apk add --no-cache curl
    - |
      title="CI broken on the main branch (pipeline $CI_PIPELINE_ID)"
      open=$(curl -s --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues?state=open&search=$title" | grep -c '"iid"')
      if [ "$open" = "0" ]; then
        curl -s --request POST --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --data-urlencode "title=$title" \
          --data-urlencode "description=A check failed on the main branch ($CI_DEFAULT_BRANCH). See $CI_PIPELINE_URL. To fix before any new workstream." \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues"
      else
        echo "A broken-CI issue is already open, no duplicate."
      fi
