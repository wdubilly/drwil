name: ia-first
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      # QUA-263: a push on a branch whose pull request is open would replay, on the same commit, what the
      # pull request plays: its steps are skipped, and the skip is said; the pull request keeps its own run.
      # No job-level `if`: a skipped job is not reported under its name. Without a pull request (or if GitHub
      # does not answer), the push is tested as before; the main branch and tags are never skipped.
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MAIN: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ github.ref_name }}
        run: |
          skip=false
          if [ "$EVENT" = push ] && [[ "$REF" == refs/heads/* ]] && [ "$REF" != "refs/heads/$MAIN" ]; then
            open=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json number --jq length) || open=0
            if [ "$open" != "0" ]; then skip=true; echo "::notice::Push skipped: the open pull request of $BRANCH already runs these checks."; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A push on the main branch whose tree (`git rev-parse HEAD^{tree}`) is the one the last green pull request CI
      # played does not replay the checks, and says so. The proof is that CI's `proven-tree` artifact, read by this
      # push only. Anything missing (no pull request, CI not green, artifact absent or expired, different tree: a
      # pull request not up to date) replays everything. The job still reports "success" under its required name.
      - name: Is the tree already proven by the last green pull request CI?
        id: proven
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          skip=false
          tree=$(git rev-parse 'HEAD^{tree}')
          for head in $(gh api "repos/$REPO/commits/$COMMIT/pulls" --jq '.[].head.sha' 2>/dev/null); do
            run=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&per_page=100" --jq '[.workflow_runs[] | select(.path | startswith(".github/workflows/ia-first.yml"))] | sort_by(.created_at) | last | select(.conclusion == "success") | .id' 2>/dev/null) || continue
            [ -n "$run" ] || continue
            rm -rf "$RUNNER_TEMP/proof"
            gh run download "$run" --repo "$REPO" --name proven-tree --dir "$RUNNER_TEMP/proof" 2>/dev/null || continue
            if [ "$(cat "$RUNNER_TEMP/proof/proven-tree.txt" 2>/dev/null)" = "$tree" ]; then
              skip=true
              echo "::notice::Checks not replayed: tree $tree is the one the green pull request CI (run $run) proved."
              break
            fi
          done
          [ "$skip" = true ] || echo "Tree not proven by a green pull request CI: everything is replayed."
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.skip != 'true' && steps.proven.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      # Without gitleaks the secrets check is "not run", which fails run-checks in CI (QUA-013).
      # Pinned version, archive checked against its published sum; installed where the engine looks (~/.local/bin).
      # The download retries a transient error (a 504 included); the archive is cached under its pinned version and
      # checked on every pass, restored or not.
      - name: Restore the gitleaks archive
        if: steps.pr.outputs.skip != 'true' && steps.proven.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gitleaks.tar.gz
          key: gitleaks-8.21.2-linux-x64
      - name: Install gitleaks 8.21.2
        if: steps.pr.outputs.skip != 'true' && steps.proven.outputs.skip != 'true'
        run: |
          a="$RUNNER_TEMP/gitleaks.tar.gz"
          [ -s "$a" ] || curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 -o "$a" https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | (cd "$RUNNER_TEMP" && sha256sum -c -)
          mkdir -p ~/.local/bin && tar -xzf "$a" -C ~/.local/bin gitleaks
          ~/.local/bin/gitleaks version
      # QUA-250: on a pull request, the verdicts of the main branch's last CI are restored and
      # run-checks reuses each "ok" check whose fingerprint (files and command) is unchanged; only a
      # push on the main branch, which replays everything, saves them: a pull request never reads a
      # verdict it could have written. Without a restored cache, everything is replayed.
      - name: Restore the verdicts of the main branch's CI
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: .drwil/evidence/run-checks-verdicts.json
          key: run-checks-verdicts-${{ github.event.pull_request.base.sha }}
          restore-keys: run-checks-verdicts-
      # GitHub sets the variable CI: run-checks also plays the checks left to CI (`runAt: ["ci"]`, QUA-208), whose
      # only proof is this run on the pull request (QUA-262).
      - if: steps.pr.outputs.skip != 'true' && steps.proven.outputs.skip != 'true'
        run: node .githooks/run-checks.mjs
        env:
          DRWIL_CI_REUSE: ${{ github.event_name == 'pull_request' && '1' || '' }}
      - name: Save the main branch's verdicts
        if: always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && hashFiles('.drwil/evidence/run-checks-verdicts.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .drwil/evidence/run-checks-verdicts.json
          key: run-checks-verdicts-${{ github.sha }}
      # QUA-113: on a pull request, the checks are replayed with the main branch's hooks (its
      # .githooks/, read through Git) and the PR's list of checks: a PR that weakens a hook or
      # removes a check does not validate itself. The main branch's copy of base-checks.mjs runs;
      # the PR's only while the main branch has none yet (kit adoption).
      - name: Replay the checks with the main branch's hooks
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="origin/$BASE_REF"
          if git cat-file -e "$base:.githooks/base-checks.mjs" 2>/dev/null; then
            git show "$base:.githooks/base-checks.mjs" > "$RUNNER_TEMP/base-checks.mjs"
            node "$RUNNER_TEMP/base-checks.mjs" --base "$base"
          else
            node .githooks/base-checks.mjs --base "$base"
          fi
      # Read by the push on the main branch (step "Is the tree already proven…"): last, so only if every step of
      # the job succeeded, with the exact tree this CI played.
      - name: Record the tree proven by this CI
        if: github.event_name == 'pull_request'
        run: git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/proven-tree.txt"
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: proven-tree
          path: ${{ runner.temp }}/proven-tree.txt
      # drwil-project-begin steps
      # Steps of the project: kept as they are by `drwil init`, which rewrites everything outside the two zones.
      # drwil-project-end steps
  # drwil-project-begin jobs
  # Jobs of the project: kept as they are by `drwil init`, which rewrites everything outside the two zones.
  # drwil-project-end jobs
  # No branch protection is possible on a private repository on the free plan
  # (GitHub.com's "Merge" button stays unconditional): only an after-the-fact
  # alert is possible. Triggers only on a push to the main branch (not on
  # pull/merge requests) and only if `checks` failed; opens no duplicate if an
  # equivalent issue is already open.
  alert-if-ci-broken:
    needs: checks
    if: always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.checks.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue if CI breaks on the main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="CI broken on the main branch (run ${{ github.run_id }})"
          open=$(gh issue list --repo "${{ github.repository }}" --search "CI broken on the main branch in:title" --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$title" \
              --body "The \`checks\` job failed on the main branch (${{ github.event.repository.default_branch }}). See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. To fix before any new workstream."
          else
            echo "A broken-CI issue is already open, no duplicate."
          fi
