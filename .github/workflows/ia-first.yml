name: ia-first
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: node .githooks/run-checks.mjs
  # Portabilité du kit (point 1 de docs/projets/suites-kit-portable.md) :
  # npm test de packages/drwil (pas la suite complète run-checks.mjs, qui
  # dépend de gitleaks) doit rester vert sur les trois OS.
  kit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test --workspace packages/drwil
  # Pas de protection de branche possible sur un dépôt privé en plan gratuit
  # (le bouton « Merge » de GitHub.com reste inconditionnel) : seule une
  # alerte après coup est possible. Se déclenche seulement sur push vers la
  # branche principale (pas sur les pull/merge requests) et seulement si
  # `checks` ou `kit-tests` a échoué ; n'ouvre pas de doublon si une issue
  # équivalente est déjà ouverte.
  alerter-si-ci-cassee:
    needs: [checks, kit-tests]
    if: always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (needs.checks.result == 'failure' || needs.kit-tests.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Ouvrir une issue si la CI casse sur la branche principale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titre="CI cassée sur la branche principale (run ${{ github.run_id }})"
          deja=$(gh issue list --repo "${{ github.repository }}" --search "CI cassée sur la branche principale in:title" --state open --json number --jq 'length')
          if [ "$deja" = "0" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$titre" \
              --body "Un contrôle a échoué sur la branche principale (${{ github.event.repository.default_branch }}). Voir ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. À corriger avant tout nouveau chantier."
          else
            echo "Une issue de CI cassée est déjà ouverte, pas de doublon."
          fi
