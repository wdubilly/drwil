name: ia-first
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node .githooks/run-checks.mjs
  # Portabilité du kit (point 1 de docs/projets/suites-kit-portable.md) :
  # npm test de packages/drwil (pas la suite complète run-checks.mjs, qui
  # dépend de gitleaks) doit rester vert sur les trois OS.
  kit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test --workspace packages/drwil
